name: Deploy Control-Plane (homolog)

# CD do CONTROL-PLANE (processo separado do hub — node control-plane/index.js na CP_PORT, atrás do
# nginx em cam.box3.software). Espelha o deploy-homolog.yml do hub, mas AUTO-DESCOBRE o serviço na VPS.
# Disparo MANUAL (workflow_dispatch). Roda na infra do GitHub (SSH via secrets do environment homolog).
#
# 1ª vez: rode com dry_run=true (default) — SÓ descobre o unit/caminho + mostra /health, SEM tocar nada.
# Confirme o alvo no log; depois rode com dry_run=false para o deploy real.
#
# Secrets (environment "homolog" — os mesmos do hub): HOMOLOG_SSH_HOST/USER/KEY/PORT?/KNOWN_HOSTS?
# Variáveis (opcionais, só se a auto-descoberta falhar): CP_SERVICE, CP_APP_PATH, CP_PORT (default 4100).
# O schema NÃO precisa de migração manual: db.init() aplica control-plane/schema.sql (idempotente) no boot.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só descobrir/reportar (não deploya)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-control-plane
  cancel-in-progress: false

jobs:
  build:
    name: Build + gate (control-plane + web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install (control-plane + web)
        run: |
          npm --prefix control-plane ci || npm --prefix control-plane install --no-audit --no-fund
          npm --prefix control-plane/web ci || npm --prefix control-plane/web install --no-audit --no-fund
      # O gate de testes (vitest) roda no ci.yml em todo push (raiz instalada); aqui só buildamos o portal
      # (Vite) para gerar o control-plane/web/dist que o CP serve. `vite build` não depende de vitest.
      - name: Build do portal (dist)
        run: npm --prefix control-plane/web run build
      - name: Empacotar release (só o que sobe)
        run: |
          set -euo pipefail
          test -f control-plane/index.js
          test -f control-plane/schema.sql
          test -f control-plane/web/dist/index.html
          tar -czf cp-release.tar.gz --exclude='**/node_modules' --exclude='**/.env' control-plane
      - name: Auditar pacote (nada de node_modules/segredo)
        run: |
          set -euo pipefail
          tar -tzf cp-release.tar.gz > /tmp/cp-list.txt
          if grep -E 'node_modules/|/\.env$|\.env\.' /tmp/cp-list.txt; then
            echo "::error::cp-release.tar.gz contém arquivo proibido — abortando"; exit 1
          fi
          echo "sha256: $(sha256sum cp-release.tar.gz)"; head -n 20 /tmp/cp-list.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cp-release
          path: cp-release.tar.gz
          retention-days: 3
          if-no-files-found: error

  deploy:
    name: Deploy no VPS (control-plane)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: homolog
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cp-release

      - name: Preparar SSH
        env:
          SSH_KEY: ${{ secrets.HOMOLOG_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOMOLOG_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOMOLOG_SSH_PORT || '22' }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOMOLOG_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_KEY:?HOMOLOG_SSH_KEY ausente}"; : "${SSH_HOST:?HOMOLOG_SSH_HOST ausente}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; fi
          test -s ~/.ssh/known_hosts || { echo "::error::known_hosts vazio"; exit 1; }

      - name: Enviar release (scp)
        if: ${{ inputs.dry_run == false }}
        env:
          SSH_HOST: ${{ secrets.HOMOLOG_SSH_HOST }}
          SSH_USER: ${{ secrets.HOMOLOG_SSH_USER }}
          SSH_PORT: ${{ secrets.HOMOLOG_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          : "${SSH_USER:?HOMOLOG_SSH_USER ausente}"
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            cp-release.tar.gz "$SSH_USER@$SSH_HOST:cp-release.tar.gz"

      - name: Descobrir + (deploy) + health-check
        env:
          SSH_HOST: ${{ secrets.HOMOLOG_SSH_HOST }}
          SSH_USER: ${{ secrets.HOMOLOG_SSH_USER }}
          SSH_PORT: ${{ secrets.HOMOLOG_SSH_PORT || '22' }}
          DRY_RUN: ${{ inputs.dry_run }}
          CP_SERVICE: ${{ vars.CP_SERVICE }}
          CP_APP_PATH: ${{ vars.CP_APP_PATH }}
          CP_PORT: ${{ vars.CP_PORT || '4100' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            "$SSH_USER@$SSH_HOST" \
            "DRY_RUN='$DRY_RUN' CP_SERVICE='$CP_SERVICE' CP_APP_PATH='$CP_APP_PATH' CP_PORT='$CP_PORT' bash -s" <<'REMOTE'
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
          SERVICE="${CP_SERVICE:-}"; APP="${CP_APP_PATH:-}"

          echo "== AUTO-DESCOBERTA do control-plane (unit que roda control-plane/index.js) =="
          if [ -z "$SERVICE" ] || [ -z "$APP" ]; then
            for u in $($SUDO systemctl list-units --type=service --all --no-legend --plain 2>/dev/null | awk '{print $1}'); do
              frag="$($SUDO systemctl cat "$u" 2>/dev/null || true)"
              if printf '%s' "$frag" | grep -q 'control-plane/index\.js'; then
                [ -z "$SERVICE" ] && SERVICE="${u%.service}"
                exj="$(printf '%s' "$frag" | grep -oE '/[^ ]+/control-plane/index\.js' | head -1 || true)"
                wd="$(printf '%s' "$frag" | grep -oE 'WorkingDirectory=[^ ]+' | head -1 | cut -d= -f2 || true)"
                if [ -z "$APP" ] && [ -n "$exj" ]; then APP="$(dirname "$exj")"; fi
                if [ -z "$APP" ] && [ -n "$wd" ]; then APP="$wd/control-plane"; fi
                break
              fi
            done
          fi
          echo "  → CP_SERVICE = ${SERVICE:-'(NÃO ACHADO)'}"
          echo "  → CP_APP_PATH = ${APP:-'(NÃO ACHADO)'}"
          [ -n "$SERVICE" ] && [ -n "$APP" ] || { echo "ERRO: não localizei o control-plane. Rode de novo com as vars CP_SERVICE/CP_APP_PATH setadas."; exit 1; }
          echo "  → /health atual:"; curl -fsS -m 5 "http://127.0.0.1:${CP_PORT}/health" || echo "   (/health não respondeu — CP pode estar em outra porta; ajuste CP_PORT)"
          echo

          if [ "$DRY_RUN" = "true" ]; then
            echo "== DRY-RUN: nada foi alterado. Confirme o alvo acima e rode de novo com dry_run=false. =="
            exit 0
          fi

          echo "== DEPLOY REAL =="
          TAR="$HOME/cp-release.tar.gz"; STAGE=/tmp/cp-deploy-staging
          trap 'rm -rf "$STAGE" 2>/dev/null || true; rm -f "$TAR"' EXIT
          test -f "$TAR" || { echo "ERRO: release não enviado"; exit 1; }
          test -d "$APP" || { echo "ERRO: $APP não existe"; exit 1; }
          echo "-- backup aditivo --"; $SUDO cp -a "$APP" "$APP.bak-$(date +%F-%H%M%S)"
          echo "-- staging + posicionar (aditivo; .env/node_modules preservados) --"
          $SUDO rm -rf "$STAGE"; mkdir "$STAGE"; tar -xzf "$TAR" -C "$STAGE"
          $SUDO cp -r "$STAGE/control-plane/." "$APP/"
          echo "-- deps de produção (pg, ws) --"; cd "$APP"
          $SUDO npm ci --omit=dev --no-audit --no-fund || $SUDO npm install --omit=dev --no-audit --no-fund
          echo "-- restart (schema.sql auto-migra via db.init) --"; $SUDO systemctl restart "$SERVICE"
          echo "-- health-check --"; OK=0
          for _ in $(seq 1 20); do
            if curl -fsS -m 5 "http://127.0.0.1:${CP_PORT}/health" | grep -q '"ok":true'; then OK=1; break; fi
            sleep 3
          done
          if [ "$OK" -eq 1 ]; then echo "HEALTH OK — control-plane no ar (/health)."; exit 0; fi
          echo "HEALTH FALHOU — VERMELHO. Reverter: sudo systemctl stop $SERVICE; restaurar $APP.bak-*; start."
          $SUDO journalctl -u "$SERVICE" -n 40 --no-pager || true
          exit 1
          REMOTE
