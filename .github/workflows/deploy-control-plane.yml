name: Deploy Control-Plane (homolog)

# CD do CONTROL-PLANE (processo separado do hub — node control-plane/index.js na CP_PORT, atrás do
# nginx em cam.box3.software). Espelha o deploy-homolog.yml do hub, mas AUTO-DESCOBRE o serviço na VPS.
# Disparo MANUAL (workflow_dispatch). SSH via secrets do environment homolog.
#
# 1ª vez: dry_run=true (default) → só DIAGNOSTICA como o CP roda (systemd/pm2/docker/porta) e tenta
# descobrir CP_SERVICE/CP_APP_PATH — SEM tocar nada, e SEM falhar. Confirme no log; depois dry_run=false.
#
# Secrets (environment "homolog"): HOMOLOG_SSH_HOST/USER/KEY/PORT?/KNOWN_HOSTS?
# Variáveis (opcionais, override se a auto-descoberta falhar): CP_SERVICE, CP_APP_PATH, CP_PORT (default 4100).
# Schema NÃO precisa de migração manual: db.init() aplica control-plane/schema.sql (idempotente) no boot.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só diagnosticar/descobrir (não deploya)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-control-plane
  cancel-in-progress: false

jobs:
  build:
    name: Build + gate (control-plane + web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install (control-plane + web)
        run: |
          npm --prefix control-plane ci || npm --prefix control-plane install --no-audit --no-fund
          npm --prefix control-plane/web ci || npm --prefix control-plane/web install --no-audit --no-fund
      # O gate de testes (vitest) roda no ci.yml em todo push; aqui só buildamos o portal (Vite → dist).
      - name: Build do portal (dist)
        run: npm --prefix control-plane/web run build
      - name: Empacotar release (só o que sobe)
        run: |
          set -euo pipefail
          test -f control-plane/index.js
          test -f control-plane/schema.sql
          test -f control-plane/web/dist/index.html
          tar -czf cp-release.tar.gz --exclude='**/node_modules' --exclude='**/.env' control-plane
      - name: Auditar pacote (nada de node_modules/segredo)
        run: |
          set -euo pipefail
          tar -tzf cp-release.tar.gz > /tmp/cp-list.txt
          if grep -E 'node_modules/|/\.env$|\.env\.' /tmp/cp-list.txt; then
            echo "::error::pacote contém arquivo proibido"; exit 1
          fi
          echo "sha256: $(sha256sum cp-release.tar.gz)"; head -n 20 /tmp/cp-list.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cp-release
          path: cp-release.tar.gz
          retention-days: 3
          if-no-files-found: error

  deploy:
    name: Deploy no VPS (control-plane)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: homolog
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cp-release

      - name: Preparar SSH
        env:
          SSH_KEY: ${{ secrets.HOMOLOG_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOMOLOG_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOMOLOG_SSH_PORT || '22' }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOMOLOG_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_KEY:?HOMOLOG_SSH_KEY ausente}"; : "${SSH_HOST:?HOMOLOG_SSH_HOST ausente}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null; fi
          test -s ~/.ssh/known_hosts || { echo "::error::known_hosts vazio"; exit 1; }

      - name: Enviar release (scp)
        if: ${{ inputs.dry_run == false }}
        env:
          SSH_HOST: ${{ secrets.HOMOLOG_SSH_HOST }}
          SSH_USER: ${{ secrets.HOMOLOG_SSH_USER }}
          SSH_PORT: ${{ secrets.HOMOLOG_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          : "${SSH_USER:?HOMOLOG_SSH_USER ausente}"
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            cp-release.tar.gz "$SSH_USER@$SSH_HOST:cp-release.tar.gz"

      - name: Diagnosticar/descobrir + (deploy) + health-check
        env:
          SSH_HOST: ${{ secrets.HOMOLOG_SSH_HOST }}
          SSH_USER: ${{ secrets.HOMOLOG_SSH_USER }}
          SSH_PORT: ${{ secrets.HOMOLOG_SSH_PORT || '22' }}
          DRY_RUN: ${{ inputs.dry_run }}
          CP_SERVICE: ${{ vars.CP_SERVICE }}
          CP_APP_PATH: ${{ vars.CP_APP_PATH }}
          CP_PORT: ${{ vars.CP_PORT || '4100' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            "$SSH_USER@$SSH_HOST" \
            "DRY_RUN='$DRY_RUN' CP_SERVICE='$CP_SERVICE' CP_APP_PATH='$CP_APP_PATH' CP_PORT='$CP_PORT' bash -s" <<'REMOTE'
          set -uo pipefail
          SERVICE="${CP_SERVICE:-}"; APP="${CP_APP_PATH:-}"

          echo "== DIAGNÓSTICO: como o control-plane roda nesta VPS =="
          echo "-- node procs com index.js --";  pgrep -af 'index\.js' 2>/dev/null || echo "  (nenhum)"
          echo "-- procs 'control-plane' --";     pgrep -af 'control-plane' 2>/dev/null || echo "  (nenhum)"
          echo "-- units systemd (control|plane|cp|visao) --"; systemctl list-units --type=service --all --no-legend --plain 2>/dev/null | grep -iE 'control|plane|cp|visao' || echo "  (nenhum)"
          echo "-- portas em escuta (4100/41xx/node) --"; { ss -ltnp 2>/dev/null || sudo -n ss -ltnp 2>/dev/null; } | grep -iE ':(4100|41[0-9][0-9])\b|node' | head || echo "  (nada)"
          echo "-- pm2 --"; if command -v pm2 >/dev/null 2>&1; then pm2 list 2>/dev/null | grep -iE 'plane|cp|control|online' || echo "  (pm2 sem match)"; else echo "  (sem pm2)"; fi
          echo "-- docker --"; if command -v docker >/dev/null 2>&1; then docker ps --format '{{.Names}} {{.Ports}}' 2>/dev/null | grep -iE 'plane|cp|control' || echo "  (docker sem match)"; else echo "  (sem docker)"; fi
          echo

          echo "== AUTO-DESCOBERTA (systemd → pgrep; sem sudo p/ leitura) =="
          if [ -z "$SERVICE" ] || [ -z "$APP" ]; then
            for u in $(systemctl list-units --type=service --all --no-legend --plain 2>/dev/null | awk '{print $1}'); do
              frag="$(systemctl cat "$u" 2>/dev/null || true)"
              if printf '%s' "$frag" | grep -q 'control-plane/index\.js'; then
                [ -z "$SERVICE" ] && SERVICE="${u%.service}"
                exj="$(printf '%s' "$frag" | grep -oE '/[^ ]+/control-plane/index\.js' | head -1 || true)"
                wd="$(printf '%s' "$frag" | grep -oE 'WorkingDirectory=[^ ]+' | head -1 | cut -d= -f2 || true)"
                { [ -z "$APP" ] && [ -n "$exj" ]; } && APP="$(dirname "$exj")"
                { [ -z "$APP" ] && [ -n "$wd" ]; } && APP="$wd/control-plane"
                break
              fi
            done
          fi
          if [ -z "$SERVICE" ] || [ -z "$APP" ]; then
            PID="$(pgrep -f 'control-plane/index\.js' 2>/dev/null | head -1 || true)"
            if [ -n "$PID" ]; then
              cmd="$(tr '\0' ' ' < /proc/$PID/cmdline 2>/dev/null || true)"
              cwd="$(readlink -f /proc/$PID/cwd 2>/dev/null || true)"
              exj="$(printf '%s' "$cmd" | grep -oE '/[^ ]+/control-plane/index\.js' | head -1 || true)"
              { [ -z "$APP" ] && [ -n "$exj" ]; } && APP="$(dirname "$exj")"
              { [ -z "$APP" ] && [ -n "$cwd" ]; } && APP="$cwd"
              u="$(systemctl status "$PID" 2>/dev/null | awk 'NR==1{print $2}' || true)"
              { [ -z "$SERVICE" ] && [ -n "$u" ] && [ "$u" != "-" ]; } && SERVICE="${u%.service}"
              echo "  (via pgrep) PID=$PID cwd=$cwd"
            fi
          fi
          echo "  → CP_SERVICE  = ${SERVICE:-(não achado)}"
          echo "  → CP_APP_PATH = ${APP:-(não achado)}"
          echo "  → /health (porta $CP_PORT):"; curl -fsS -m 5 "http://127.0.0.1:${CP_PORT}/health" 2>/dev/null || echo "    (sem resposta em :$CP_PORT — CP pode usar outra porta; ajuste CP_PORT)"
          echo

          if [ "$DRY_RUN" = "true" ]; then
            echo "== DRY-RUN: nada alterado. Use os valores acima p/ o deploy real (dry_run=false), ou seta as vars. =="
            exit 0
          fi

          echo "== DEPLOY REAL =="
          [ -n "$SERVICE" ] && [ -n "$APP" ] || { echo "ERRO: control-plane não localizado — defina as vars CP_SERVICE/CP_APP_PATH."; exit 1; }
          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo -n"; fi
          TAR="$HOME/cp-release.tar.gz"; STAGE=/tmp/cp-deploy-staging
          trap 'rm -rf "$STAGE" 2>/dev/null || true; rm -f "$TAR"' EXIT
          test -f "$TAR" || { echo "ERRO: release não enviado"; exit 1; }
          test -d "$APP" || { echo "ERRO: $APP não existe"; exit 1; }
          echo "-- backup --"; $SUDO cp -a "$APP" "$APP.bak-$(date +%F-%H%M%S)"
          echo "-- posicionar (aditivo; .env/node_modules preservados) --"
          $SUDO rm -rf "$STAGE"; mkdir "$STAGE"; tar -xzf "$TAR" -C "$STAGE"; $SUDO cp -r "$STAGE/control-plane/." "$APP/"
          echo "-- deps (pg, ws) --"; cd "$APP"; $SUDO npm ci --omit=dev --no-audit --no-fund || $SUDO npm install --omit=dev --no-audit --no-fund
          echo "-- restart (schema auto-migra) --"; $SUDO systemctl restart "$SERVICE"
          OK=0; for _ in $(seq 1 20); do curl -fsS -m 5 "http://127.0.0.1:${CP_PORT}/health" | grep -q '"ok":true' && { OK=1; break; }; sleep 3; done
          [ "$OK" -eq 1 ] && { echo "HEALTH OK — control-plane no ar."; exit 0; }
          echo "HEALTH FALHOU — reverter: sudo systemctl stop $SERVICE; restaurar $APP.bak-*; start."; $SUDO journalctl -u "$SERVICE" -n 40 --no-pager || true; exit 1
          REMOTE
