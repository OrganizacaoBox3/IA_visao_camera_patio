# ══════════════════════════════════════════════════════════════════════════════
# Ponte DVR — nginx do RELAY (B-3). Front autenticado que publica a web do DVR por
# SUBDOMÍNIO, sempre atrás do login do portal (auth_request → control-plane /_dvr_auth).
# Base: box3-mobile/planejamento/ponte-dvr/de-risking/relay-proxy.md §2..§7 + contratos.md §5.
# Detalhes de deploy, TLS wildcard e o mecanismo de upstream: relay/nginx/README.md.
#
# ⚠️ NENHUM segredo no repo (invariante 6). Caminhos de cert e o host do control-plane são
#    materializados no deploy. ⚠️ VPS DEDICADA (isolada do control-plane); firewall só 443 (aqui)
#    e 7000 (frps) públicos. A porta bruta do túnel nasce em 127.0.0.1 (frps proxyBindAddr).
# ══════════════════════════════════════════════════════════════════════════════

# WebSocket upgrade (o live view HTML5 do DVR usa ws/wss) — mapa padrão do nginx.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cache leve p/ assets pesados da UI do DVR (JS/imagens grandes e lentos — armadilha #10).
proxy_cache_path /var/cache/nginx/dvr levels=1:2 keys_zone=dvr:10m max_size=200m inactive=10m;

# http → https (o wildcard é DNS-01; não usamos http-01, então a :80 só redireciona).
server {
    listen 80;
    server_name ~^.+\.dvr\.box3\.software$;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    # Subdomínio por DVR, servido na RAIZ (nunca path — a UI do DVR usa caminhos absolutos, §2).
    server_name ~^(?<sub>[a-z0-9-]+)\.dvr\.box3\.software$;

    # ── TLS WILDCARD *.dvr.box3.software (Let's Encrypt DNS-01 — ver README) ──
    # Wildcard porque um DVR novo sobe sessão NA HORA: não dá p/ emitir cert host-a-host on-demand.
    ssl_certificate     /etc/letsencrypt/live/dvr.box3.software/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dvr.box3.software/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ── FRONTEIRA DE AUTH: toda request passa pela subrequisição ao control-plane ──
    # (contratos §5 / de-risking §3). 2xx libera; 401/403 caem nos error_page abaixo.
    auth_request /_dvr_auth;

    # UPSTREAM DINÂMICO (mecanismo escolhido — ver README §Upstream dinâmico): a subrequisição de
    # auth devolve o alvo no header X-Dvr-Upstream (= 127.0.0.1:<remotePort>, vindo do rotasAtivas()
    # que o control-plane lê ao validar a sessão). Capturamos com auth_request_set e usamos no
    # proxy_pass. SEM map file, SEM reload, SEM sync entre máquinas: a rota É a linha de sessão
    # ativa (fonte única), resolvida por request.
    auth_request_set $dvr_upstream $upstream_http_x_dvr_upstream;

    # 401 → técnico não logado / sessão caiu / host sem túnel: manda logar no portal, com retorno.
    # 403 → técnico logado, mas SEM acesso àquele cliente/DVR: página de negado (não relogar).
    error_page 401 = @login;
    error_page 403 = @forbidden;
    location @login {
        return 302 https://coletor.box3.software/login?return=https://$host$request_uri;
    }
    location @forbidden {
        default_type text/plain;
        return 403 "Sem acesso a este DVR.\n";
    }

    # Subrequisição interna: valida sessão do técnico (COOKIE) + Host↔DVR + autorização + timeout.
    location = /_dvr_auth {
        internal;
        # Control-plane do visão. LITERAL (sem variável) → não exige `resolver`. Edite no deploy.
        proxy_pass              https://coletor.box3.software/_dvr_auth;
        proxy_pass_request_body off;                        # a checagem não lê corpo
        proxy_set_header        Content-Length "";
        proxy_set_header        Cookie          $http_cookie;    # cookie de sessão do técnico (C-be-7)
        proxy_set_header        X-Original-Host $host;            # QUAL DVR (o control-plane casa Host↔sessão)
        proxy_set_header        X-Original-URI  $request_uri;
        proxy_set_header        X-Real-IP       $remote_addr;
    }

    # ── PROXY da web do DVR ──
    location / {
        # 127.0.0.1:<remotePort> vindo do auth. IP LITERAL → dispensa `resolver` (nginx só exigiria
        # resolver se o valor da variável fosse um NOME a resolver por DNS).
        proxy_pass http://$dvr_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket (vídeo/eventos HTML5 do DVR): proxia o Upgrade (armadilha #1, parte proxy).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # DVR é lento p/ abrir e mantém sockets longos: timeouts generosos.
        proxy_connect_timeout 30s;
        proxy_read_timeout    7m;
        proxy_send_timeout    7m;

        # Reescreve redirects Location: do DVR (http://IP-interno/..) p/ o nosso host (armadilha #4).
        proxy_redirect ~^https?://[^/]+(/.*)$ https://$host$1;
        # Cookies do DVR: colam no subdomínio (armadilha #6).
        proxy_cookie_domain ~.* $host;
        proxy_cookie_path   / /;
        proxy_cookie_flags  ~ secure;

        proxy_cache dvr;
        proxy_cache_valid 200 5m;

        # ── ARMADILHA #1 (relay-proxy.md §6): host/porta HARDCODED no front-end + WebSocket em
        # portas FIXAS de firmware (Hikvision 7681 plano / 7682 TLS). O JS tenta abrir
        # wss://host:7682 e o live view não conecta pelo proxy. sub_filter reescreve p/ o nosso
        # host (wss://$host, via 443). Precisa DESLIGAR gzip p/ o nginx ler o corpo (armadilha #8)
        # e cobrir os content-types. Portas 7681/7682 são fixas → match estático é seguro.
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        # text/html já é o default do módulo — não repetir (evita warning de MIME duplicado).
        sub_filter_types application/javascript text/javascript application/json text/css;
        sub_filter "ws://$host:7681"  "wss://$host";      # WS plano hardcoded
        sub_filter "wss://$host:7682" "wss://$host";      # WS TLS hardcoded
        sub_filter "http://"          "https://";         # evita mixed-content (armadilha #5)
        # NOTA (per-DVR): o IP INTERNO do DVR (ex.: 192.168.1.108) também costuma vir hardcoded no
        # corpo, mas é POR DVR (não fixo) → um match estático não serve. O control-plane conhece
        # dvr.ip (do registro) e pode devolvê-lo num header (ex.: X-Dvr-Lan-Ip) p/ auth_request_set
        # + sub_filter com variável no match (nginx recente). Ligar quando o parque exigir — ver
        # README §sub_filter. Live view por ActiveX (firmware antigo) NÃO roda em navegador (§6 #2).
    }
}
