# nginx do hub de visao DENTRO do container (Fly). Espelha deploy/nginx-visao.conf, com tres
# diferencas obrigatorias, todas de plataforma:
#   1. sem TLS/certbot — o edge do Fly termina HTTPS e entrega HTTP na 8080;
#   2. sem server_name fixo — o host vem do dominio que o cliente apontar (fly certs);
#   3. log em stdout/stderr — no Fly o log e o journal da machine, nao arquivo em disco.
# A POLITICA DE HEADERS abaixo e copia VERBATIM da conf do servidor: mudar seguranca de
# contrabando, num PR de empacotamento, seria a pior hora para mudar seguranca.
#
# Por que nginx aqui e nao "o node serve o dist": o hub NAO serve estatico (server/index.js nao
# tem static handler nenhum) — quem serve o dist/ e a CSP hoje e o nginx. Trocar isso seria
# reescrever o front-end do deploy num PR de infra.

map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 8080;
	listen [::]:8080;
	server_name _;

	root  /app/dist;
	index index.html;

	access_log /dev/stdout;
	error_log  /dev/stderr warn;

	add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://storage.googleapis.com https://tfhub.dev https://www.kaggle.com; connect-src 'self' wss: https://cdn.jsdelivr.net https://storage.googleapis.com https://tfhub.dev https://www.kaggle.com https://*.kaggle.com https://huggingface.co https://*.huggingface.co https://*.hf.co; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.arcgisonline.com; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self';" always;
	add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header Cache-Control "public, immutable";

	location /socket.io/ {
		proxy_pass http://127.0.0.1:8091;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		# O edge do Fly termina TLS: o esquema real chega em X-Forwarded-Proto, nao em $scheme.
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
		proxy_read_timeout 600s;   # conexoes wss longas
		proxy_buffering off;
	}

	location /api/ {
		proxy_pass http://127.0.0.1:8091;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
	}

	# Assets com hash no nome: imutaveis. add_header em location SUBSTITUI os herdados do server,
	# entao a politica inteira e re-declarada aqui (a conf do servidor re-declara so o nosniff, e
	# por isso perde CSP/HSTS nas respostas de /assets/ — aqui nao perde).
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://storage.googleapis.com https://tfhub.dev https://www.kaggle.com; connect-src 'self' wss: https://cdn.jsdelivr.net https://storage.googleapis.com https://tfhub.dev https://www.kaggle.com https://*.kaggle.com https://huggingface.co https://*.huggingface.co https://*.hf.co; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.arcgisonline.com; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self';" always;
	add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	add_header Cache-Control "public, immutable";
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
