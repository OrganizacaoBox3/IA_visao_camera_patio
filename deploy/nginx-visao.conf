# nginx — Visão de Pátio (visao_computacional_mvp) em VPS compartilhada.
# ---------------------------------------------------------------------------
# Cenário: as portas 80/443 já são do nginx existente. Aqui adicionamos APENAS um
# server block (subdomínio) que:
#   1) serve a SPA estática (dist/) — o nginx é rápido nisso;
#   2) faz proxy de /socket.io/ → hub Node em 127.0.0.1:8091 (com upgrade de WebSocket);
#   3) aplica os headers de segurança (espelham o vite.config.ts).
#
# Instalar:
#   sudo cp deploy/nginx-visao.conf /etc/nginx/conf.d/visao.conf
#   # editar o server_name e os caminhos de certificado
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: reaproveite o certbot já presente na VPS:
#   sudo certbot --nginx -d visao.seudominio.com
# (o certbot preenche ssl_certificate / listen 443 ssl automaticamente; se usar isso,
#  pode remover as 3 linhas de SSL/listen abaixo e deixar o certbot gerenciá-las).
# ---------------------------------------------------------------------------

# Mapa para upgrade de WebSocket. ATENÇÃO: se o nginx.conf já define um
# "map $http_upgrade $connection_upgrade" (comum), REMOVA estas 4 linhas para não duplicar.
map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name visao.seudominio.com;

	# Certificado (ajuste o caminho — ou deixe o certbot preencher):
	ssl_certificate     /etc/letsencrypt/live/visao.seudominio.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/visao.seudominio.com/privkey.pem;

	# SPA estática gerada pelo `npm run build`
	root  /var/www/visao-patio/dist;
	index index.html;

	# Headers de segurança (espelham vite.config.ts dev/preview).
	# 'always' garante que valham inclusive em respostas de erro.
	add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://storage.googleapis.com https://tfhub.dev https://www.kaggle.com; connect-src 'self' wss: https://cdn.jsdelivr.net https://storage.googleapis.com https://tfhub.dev https://www.kaggle.com https://*.kaggle.com https://huggingface.co https://*.huggingface.co https://*.hf.co; img-src 'self' data: blob: https://*.tile.openstreetmap.org; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self';" always;
	add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

	# Hub de câmeras (socket.io) — proxy para o Node local. Forçamos transports=websocket
	# no cliente, então este location carrega o tráfego de frames via wss.
	location /socket.io/ {
		proxy_pass http://127.0.0.1:8091;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 600s;   # conexões wss longas
		proxy_buffering off;
	}

	# API HTTP do hub (login / gestão de usuários) — proxy pro Node local.
	location /api/ {
		proxy_pass http://127.0.0.1:8091;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}

	# Assets versionados (hash no nome) — cache longo. Como `add_header` num location
	# SUBSTITUI (não herda) os headers do server, repetimos os de segurança aqui.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		add_header X-Content-Type-Options "nosniff" always;
	}

	# SPA: tudo que não for arquivo cai no index.html (rotas client-side).
	location / {
		try_files $uri $uri/ /index.html;

		# Acesso restrito enquanto não há login no app (task #25). Descomente:
		# auth_basic           "Visao de Patio";
		# auth_basic_user_file /etc/nginx/.htpasswd-visao;
		# Gere o arquivo:  sudo htpasswd -c /etc/nginx/.htpasswd-visao operador
	}
}
